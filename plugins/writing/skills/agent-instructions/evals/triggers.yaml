version: 1
workspace:
  seed: node-service
cases:
  - id: create-agents-md
    prompt: >-
      Create an AGENTS.md for this repository covering the build, test, and commit conventions.
    expect: invoke
    rationale: The user is asking to create an agent-facing instruction file.

  - id: add-claude-md-rule
    prompt: >-
      Add a rule to CLAUDE.md that the linter must run before every commit.
    expect: invoke
    rationale: The user is asking to edit an agent-facing instruction file.

  - id: review-skill-body-diff
    prompt: |-
      Review this diff to our deploy skill's SKILL.md for instruction quality.

      --- a/skills/deploy/SKILL.md
      +++ b/skills/deploy/SKILL.md
      @@ -6,4 +6,6 @@
       ## Steps

       1. Run the test suite.
      -2. Deploy to staging.
      +2. Deploy to staging if it seems safe.
      +3. You should probably check the dashboards after deploying.
      +4. Be careful with production.
    expect: invoke
    rationale: >-
      The user supplies a diff to a skill body, an agent-facing file, for instruction review; the
      diff is not a change in this checkout, so no session-change review workflow owns it.

  - id: session-change-review
    prompt: >-
      Review the SKILL.md changes in my worktree before I commit.
    expect: skip
    invoke-instead: engineering:review-changes
    rationale: >-
      Reviewing a session's own changes before a commit is a review workflow's entry point; that
      workflow applies this skill inside its prose lane.

  - id: system-prompt-fragment
    prompt: >-
      Write the system prompt for our triage subagent.
    expect: invoke
    rationale: The user is asking to author a system-prompt fragment that instructs an agent.

  - id: tighten-bloated-agents-md
    prompt: >-
      Our AGENTS.md has grown to 400 lines and agents keep missing the important rules. Tighten it.
    expect: invoke
    rationale: The user is asking to prune and restructure an agent-facing instruction file.

  - id: author-subagent-prompt
    prompt: >-
      Write the prompt for a sub-agent that audits our API error handling and returns a structured
      findings list.
    expect: invoke
    rationale: The user is asking to author a one-shot sub-agent prompt, which the skill owns.

  - id: delegate-implementation
    prompt: >-
      Have a sub-agent implement the /health endpoint and report back with the diff.
    expect: invoke
    rationale:
      Delegated implementation dispatches a sub-agent, so the skill applies before writing its task
      prompt.

  - id: one-line-dispatch
    prompt: >-
      Have a background agent find which file defines the test command and report the path.
    expect: invoke
    rationale:
      The dispatch trigger has no size threshold; a one-line lookup still needs a task prompt that
      carries its context and return contract. The Claude lane has no dispatch tool, so the skill
      must load from the request itself, before the agent finds it cannot dispatch.

  - id: review-bundled-script
    prompt: >-
      Check whether skills/release/scripts/check-changelog.sh, the script our release skill bundles,
      will run on macOS as well as Linux.
    workspace_files:
      skills/release/SKILL.md: |
        ---
        name: release
        description: Cut a release of this package. Use when the user asks to release or tag a version.
        ---

        # Release

        1. Run `scripts/check-changelog.sh`; if it exits nonzero, stop and report its output.
        2. Bump the version with `npm version <patch|minor|major>`.
        3. Push the tag and publish with `npm publish`.
      skills/release/scripts/check-changelog.sh: |
        #!/usr/bin/env bash
        set -euo pipefail
        last_tag=$(git describe --tags --abbrev=0)
        mapfile -t subjects < <(git log --format=%s "$last_tag"..HEAD)
        tagged=$(date -d "$(git log -1 --format=%cI "$last_tag")" +%s)
        newest=$(grep -m1 -oP '^## \K\d+\.\d+\.\d+' CHANGELOG.md)
        echo "tag=$last_tag newest=$newest commits=${#subjects[@]} tagged=$tagged"
    expect: invoke
    rationale:
      The prompt touches no SKILL.md, so only the bundled-scripts trigger can claim it. A script a
      skill bundles binds a fragile path, and the skill owns the script's contract and portability.

  - id: repo-script
    prompt: >-
      Add a script under scripts/ that bumps the version in package.json and creates the git tag.
    expect: skip
    rationale:
      A repository script that no skill bundles is ordinary implementation, not agent instructions.

  - id: human-readme
    prompt: >-
      Write a README for this package.
    expect: skip
    invoke-instead: writing:technical-writing
    rationale: A README is a technical artifact owned by the technical-writing skill.

  - id: implement-software-agent
    prompt: >-
      Implement an agent that polls the job queue and retries failed jobs with backoff.
    expect: skip
    invoke-instead: engineering:tdd
    rationale:
      The user wants software implemented; "agent" here is program code, not an instruction file.

  - id: conceptual-agents-md-question
    prompt: >-
      What is the difference between AGENTS.md and CLAUDE.md?
    expect: skip
    rationale: The user is asking a conceptual question, not creating, editing, or reviewing a file.

  - id: add-terminology-term
    prompt: >-
      Add a "staging lane" entry to the terminology table in our AGENTS.md.
    expect: skip
    invoke-instead: engineering:terminology
    rationale:
      Terminology-section content is owned by a terminology workflow, which this skill excludes.
