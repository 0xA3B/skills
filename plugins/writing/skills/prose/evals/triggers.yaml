version: 1
cases:
  - id: unslop-newsletter
    prompt: >-
      Rewrite this newsletter paragraph so it reads like a person wrote it: "In today's rapidly
      evolving landscape, our robust platform empowers teams to unlock seamless collaboration."
    expect: invoke
    rationale: Fixing AI-sounding text is an explicit trigger.

  - id: draft-announcement
    prompt: >-
      Draft a short announcement to the team that the v2 API is live.
    expect: invoke
    rationale: An announcement is prose the skill owns.

  - id: tighten-blog-intro
    prompt: >-
      Tighten this blog-post intro and cut the filler: "It is important to note that teams today are
      navigating an increasingly complex landscape, and this post will delve into several key
      considerations that may potentially help."
    expect: invoke
    rationale: Cutting filler from a blog post is a listed trigger.

  - id: shorten-chat-reply
    prompt: >-
      Rewrite this chat reply so it is shorter and reads less like a bot: "Great question! I'd be
      happy to delve into the various options that are available to you in order to help you make
      the best possible decision."
    expect: invoke
    rationale: Editing a chat response is prose work governed by the chat-responses reference.

  - id: write-readme
    prompt: >-
      Write a README for this project. It is a CLI that syncs dotfiles across machines.
    workspace_files:
      package.json: |
        {
          "name": "dotsync",
          "version": "1.0.0",
          "bin": { "dotsync": "dist/cli.js" }
        }
      docs/usage.md: |
        # Usage

        Install with `npm install --global dotsync`.

        Run `dotsync init <repository>` once to clone a dotfiles repository into `~/.dotfiles` and
        create symlinks in the home directory. Run `dotsync sync` on another machine to pull the
        repository and recreate its symlinks. The CLI supports macOS and Linux.
    expect: skip
    rationale: A README is a technical artifact owned by the technical-writing skill.

  - id: pr-description
    prompt: >-
      Draft the pull request description for a branch that adds day-based duration parsing without
      changing existing hour and minute behavior. Parser unit tests and the full test suite pass.
    expect: skip
    rationale: Pull request descriptions are owned by the technical-writing skill.

  - id: review-comment
    prompt: >-
      The feedback is already verified and fixed. Rewrite this approved merge request reply so it
      addresses the reviewer directly without losing the validation evidence: "Accepted and fixed.
      The parser now supports day-based durations, and the full test suite passes."
    expect: skip
    rationale: A durable technical reply in a review thread is owned by technical-writing.

  - id: agents-md-rule
    prompt: >-
      Add a rule to AGENTS.md that tests must be co-located in src/.
    workspace_files:
      AGENTS.md: |
        # Project instructions
    expect: skip
    rationale: Agent instruction files are owned by the agent-instructions skill.

  - id: commit-message
    prompt: >-
      Write the commit message for a change that adds day-based duration parsing and parser tests.
    expect: skip
    rationale: Commit messages are excluded from the prose base style.

  - id: refactor-code
    prompt: >-
      Refactor this function so it is easier to read: `function enabled(value) { return value ===
      true ? true : false; }`
    expect: skip
    rationale: Program code is not prose.

  - id: conceptual-slop-question
    prompt: >-
      What makes text sound AI-generated?
    expect: skip
    rationale: A conceptual question is not a request to compose, edit, or review prose.
