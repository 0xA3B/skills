version: 1
cases:
  - id: review-current-changes
    prompt: >-
      Review my current changes before I commit.
    expect: invoke
    rationale: The user asks to review changes made in this session.

  - id: review-worktree
    prompt: >-
      Review my worktree.
    expect: invoke
    rationale: The worktree holds the session's changes.

  - id: review-staged-changes
    prompt: >-
      Review the staged changes.
    expect: invoke
    rationale: Staged changes are session-authored changes awaiting commit.

  - id: review-what-we-changed
    prompt: >-
      Review what we changed today before I open the PR.
    expect: invoke
    rationale: The user asks for a review of this session's changes before publishing them.

  - id: review-session-branch
    prompt: >-
      Review the branch we built this session against main before I open the PR.
    expect: invoke
    rationale: A branch authored in this session is in scope whatever its git shape.

  - id: assigned-test-lane
    prompt: >-
      Run the test-quality lane over this diff.
    expect: invoke
    rationale: The user narrows the review to one lane over the session's changes.

  - id: instruction-file-review
    prompt: >-
      Review the SKILL.md changes in my worktree before I commit.
    expect: invoke
    rationale: Changed agent-instruction files are reviewed through the prose lane.

  - id: documentation-review
    prompt: >-
      Review the README changes I just made.
    expect: invoke
    rationale: Changed documentation is reviewed through the prose lane.

  - id: teammate-pr-review
    prompt: >-
      Review this PR from my teammate before it merges.
    expect: skip
    rationale: Work the session did not author is outside this workflow.

  - id: third-party-code-review
    prompt: >-
      Review the code quality of this open source library we depend on.
    expect: skip
    rationale: Third-party code is not session-authored work.

  - id: existing-feedback
    prompt: >-
      Address these review comments and fix the valid ones.
    expect: skip
    rationale: Existing reviewer feedback belongs to receiving-feedback.

  - id: bug-report
    prompt: >-
      The login flow crashes when I click save. Please fix it.
    expect: skip
    rationale: A first-party bug report is not a review request.

  - id: implementation-request
    prompt: >-
      Add pagination to this endpoint.
    expect: skip
    rationale: An implementation request is not a review request.

  - id: write-documentation
    prompt: >-
      Write a README for this module.
    expect: skip
    rationale: Writing documentation belongs to the writing skills.

  - id: architecture-audit
    prompt: >-
      Review the architecture of this codebase and find deepening opportunities.
    expect: skip
    rationale: A codebase-wide architecture audit belongs to improve-codebase-architecture.

  - id: conceptual-question
    prompt: >-
      What makes a code review useful?
    expect: skip
    rationale: A conceptual question does not ask for a review of changes.
