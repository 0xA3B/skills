version: 1
cases:
  - id: commit-current-work
    prompt: >-
      Commit the current work using Conventional Commits.
    workspace_files:
      src/cache.ts: |
        export const cacheTtlSeconds = 30;
    expect: invoke
    rationale: The user is asking to create git commits for current changes.

  - id: create-commit-for-changes
    prompt: >-
      Please commit these changes.
    workspace_files:
      README.md: |
        # Example project

        This project demonstrates the commit workflow.
    expect: invoke
    rationale: The user is asking for a git commit workflow.

  - id: split-and-commit
    prompt: >-
      Split my current changes into logical commits and commit them.
    workspace_files:
      src/client.ts: |
        export const requestTimeoutMs = 5000;
      docs/client.md: |
        # Client

        The client times out stalled requests.
    expect: invoke
    rationale: The user is asking for commit partitioning plus commit execution.

  - id: commit-selected-scope
    prompt: >-
      Commit only the docs updates.
    workspace_files:
      docs/setup.md: |
        # Setup

        Install dependencies before running the project.
    expect: invoke
    rationale: The user is asking to create a scoped commit.

  - id: gitmoji-commit-request
    prompt: >-
      Commit these changes using Gitmoji commit messages.
    expect: invoke
    rationale: >-
      Committing is this skill's workflow under any message convention; the repository's or the
      user's convention replaces the default profile inside it.

  - id: agents-gitmoji-commits
    prompt: >-
      Commit these changes.
    workspace_files:
      AGENTS.md: |
        # Project Conventions

        Commit messages must use Gitmoji.
    expect: invoke
    rationale: >-
      Committing is this skill's workflow under any message convention; the repository's or the
      user's convention replaces the default profile inside it.

  - id: draft-message-only
    prompt: >-
      Draft a Conventional Commit message for these changes.
    expect: skip
    rationale: The user wants message text only, not the commit execution owned by this skill.

  - id: split-guidance-only
    prompt: >-
      Review my current changes and suggest how to split them into logical Conventional Commits.
    expect: skip
    rationale: The user asks for split guidance, not commit execution.

  - id: validate-syntax
    prompt: >-
      Is "feat(api)!: remove legacy response fields" valid Conventional Commit syntax?
    expect: skip
    rationale: The user is asking to validate message syntax, not create commits.

  - id: conceptual-purpose-question
    prompt: >-
      What is the purpose of Conventional Commits?
    expect: skip
    rationale: The user is asking a conceptual question, not requesting a commit workflow.

  - id: git-history-question
    prompt: >-
      Show me the last commit in this repository.
    expect: skip
    rationale: The user is asking for git history inspection, not commit creation.

  - id: non-git-commit-phrase
    prompt: >-
      I am ready to commit to this implementation plan.
    expect: skip
    rationale: The word commit is used as ordinary language, not a git commit request.

  - id: go-ahead-commit-and-push
    prompt: >-
      Yep, go ahead and commit and push.
    workspace_files:
      src/cache.ts: |
        export const cacheTtlSeconds = 30;
    expect: invoke
    rationale: A short conversational go-ahead that chains a push after the commit.

  - id: tests-pass-commit
    prompt: >-
      The tests pass now, so commit it.
    workspace_files:
      src/cache.ts: |
        export const cacheTtlSeconds = 30;
    expect: invoke
    rationale: The commit follows a check the user reports as passed.

  - id: branch-and-commit
    prompt: >-
      Create a branch and commit this.
    workspace_files:
      src/cache.ts: |
        export const cacheTtlSeconds = 30;
    expect: invoke
    rationale: Creating the branch first does not move the commit to another skill.

  - id: amend-last-commit-message
    prompt: >-
      Amend the last commit so its message says fix instead of feat.
    workspace:
      seed: node-service
    expect: skip
    invoke-instead: git:tidy-history
    rationale: Rewriting an existing commit belongs to tidy-history.
