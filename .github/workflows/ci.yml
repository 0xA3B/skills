name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit and plugin version checks in pnpm check walk history back to the merge base
          # with origin/main and refuse a shallow clone.
          fetch-depth: 0

      # mise installs shfmt and ShellCheck, which pnpm/setup does not, with Node.js and pnpm at the
      # releases mise.lock pins; see docs/adr/0003-mise-installs-and-locks-the-toolchain.md. The
      # action puts those tools on PATH for later steps, so they run without `mise exec --`.
      - name: Set up tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # Without a version, the action installs the newest mise release with no three-day
          # cooldown; Renovate updates this input.
          version: 2026.11.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check
