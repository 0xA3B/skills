name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit and plugin version checks in pnpm check walk history back to the merge base
          # with origin/main and refuse a shallow clone.
          fetch-depth: 0

      # Installs the pnpm release pnpm-lock.yaml locks and the Node release devEngines.runtime
      # selects, then runs a frozen install.
      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Run checks
        run: pnpm check
